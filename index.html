<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>W Commonwealth Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.14);
      --glass-highlight: rgba(255,255,255,0.22);
      --accent: #3ecfff;
      --accent2: #a78bfa;
      --accent3: #34d399;
      --text-primary: rgba(255,255,255,0.95);
      --text-secondary: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.3);
      --bg-deep: #050810;
      --radius-lg: 24px;
      --font-main: 'Space Grotesk', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 420px;
      max-width: 92vw;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      backdrop-filter: blur(40px);
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="login-card">
  <h2>Walar Login</h2>

  <input class="input-field" id="username" placeholder="username">
  <input class="input-field" id="password" type="password" placeholder="password">

  <button class="btn-primary" onclick="login()">Sign In</button>

  <p id="error" style="color:red; display:none;"></p>
</div>

<script>
/* ===================== FAILOVER SYSTEM ===================== */

const API_PRIMARY = 'https://api.walar.xyz';
const API_SECONDARY = 'https://api2.walar.xyz';

let API = API_PRIMARY;

// test server health
async function ping(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2500);

  try {
    const start = Date.now();
    await fetch(url + '/health', { signal: controller.signal });
    clearTimeout(timeout);
    return { ok: true, ms: Date.now() - start };
  } catch {
    clearTimeout(timeout);
    return { ok: false, ms: Infinity };
  }
}

// choose best API at load
async function selectAPI() {
  const [p, s] = await Promise.all([
    ping(API_PRIMARY),
    ping(API_SECONDARY)
  ]);

  if (p.ok && p.ms <= s.ms) {
    API = API_PRIMARY;
  } else if (s.ok) {
    API = API_SECONDARY;
  } else {
    API = API_PRIMARY; // fallback default
  }

  console.log("API selected:", API);
}

// safe fetch with fallback
async function apiFetch(path, options = {}) {
  try {
    return await fetch(API + path, options);
  } catch (e) {
    const fallback = API === API_PRIMARY ? API_SECONDARY : API_PRIMARY;
    return await fetch(fallback + path, options);
  }
}

/* ===================== AUTH ===================== */

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const error = document.getElementById('error');

  error.style.display = 'none';

  if (!username || !password) {
    error.textContent = "Missing fields";
    error.style.display = 'block';
    return;
  }

  try {
    const res = await apiFetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('isLoggedIn', 'true');
      window.location.href = 'main.html';
    } else {
      error.textContent = data.error || "Login failed";
      error.style.display = 'block';
    }

  } catch {
    error.textContent = "Server unavailable";
    error.style.display = 'block';
  }
}

/* ===================== INIT ===================== */

(async function init() {
  await selectAPI();
})();
</script>

</body>
</html>

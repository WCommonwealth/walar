<body>

<script>
if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
</script>

<!-- ================= NAV / UI (UNCHANGED IN YOUR ORIGINAL) ================= -->


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
// ===================== API FAILOVER SYSTEM =====================
const API_PRIMARY = 'https://api.walar.xyz';
const API_SECONDARY = 'https://api2.walar.xyz';

let API = API_PRIMARY;
let socket = null;
const token = localStorage.getItem('token');
const username = localStorage.getItem('username') || 'Member';

// ping API
async function ping(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2500);
  try {
    const start = Date.now();
    await fetch(url + '/health', { signal: controller.signal });
    clearTimeout(timeout);
    return { ok: true, ms: Date.now() - start };
  } catch {
    clearTimeout(timeout);
    return { ok: false, ms: Infinity };
  }
}

// select best API
async function selectAPI() {
  const [p, s] = await Promise.all([
    ping(API_PRIMARY),
    ping(API_SECONDARY)
  ]);

  if (p.ok && p.ms <= s.ms) {
    API = API_PRIMARY;
    console.log('PRIMARY API selected');
  } else if (s.ok) {
    API = API_SECONDARY;
    console.log('SECONDARY API selected');
  } else {
    console.warn('No API available');
  }
}

// safe fetch wrapper
async function apiFetch(path, options = {}) {
  try {
    return await fetch(API + path, options);
  } catch (e) {
    const fallback = API === API_PRIMARY ? API_SECONDARY : API_PRIMARY;
    return await fetch(fallback + path, options);
  }
}

// ===================== UI INIT =====================
document.getElementById('navUsername')?.textContent = username;

function toggleDropdown(){document.getElementById('navUser').classList.toggle('open');}
function toggleApps(){document.getElementById('appsPanel').classList.toggle('open');}
function toggleOnlineDropdown(){document.getElementById('onlinePill').classList.toggle('open');}

// ===================== SOCKET =====================
function initSocket(){
  if(!token) return;

  socket = io(API, {
    auth: { token },
    transports: ['polling']
  });

  socket.on('connect_error', async () => {
    console.log('Socket failed → switching API');
    API = API === API_PRIMARY ? API_SECONDARY : API_PRIMARY;
    socket.disconnect();
    initSocket();
  });

  socket.on('online_users', users => {
    document.getElementById('onlineCount').textContent = users.length + ' online';
    document.getElementById('onlineList').innerHTML = users.map(u =>
      `<div class="online-member"><div class="online-member-dot"></div><span>${u}</span></div>`
    ).join('');
  });

  socket.on('new_message', () => {
    const badge = document.getElementById('mailBadge');
    const n = (parseInt(badge.textContent) || 0) + 1;
    badge.textContent = n > 9 ? '9+' : n;
    badge.classList.add('visible');
  });
}

// ===================== MAIL CHECK =====================
async function checkUnread(){
  try {
    const res = await apiFetch('/messages/unread', {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();

    const badge = document.getElementById('mailBadge');
    if(data.count > 0){
      badge.textContent = data.count > 9 ? '9+' : data.count;
      badge.classList.add('visible');
    } else {
      badge.classList.remove('visible');
    }
  } catch {}
}

// ===================== LOGOUT =====================
function logout(){
  if(socket) socket.disconnect();
  localStorage.clear();
  window.location.href = 'index.html';
}

// ===================== INIT APP =====================
async function initApp(){
  await selectAPI();
  initSocket();
  checkUnread();
  setInterval(checkUnread, 30000);
}

initApp();
</script>

</body>
</html>
